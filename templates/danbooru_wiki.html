<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Danbooru 标签查询</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#3B82F6',
                        secondary: '#10B981',
                        accent: '#F59E0B',
                        danger: '#EF4444',
                        dark: '#1E293B',
                        light: '#F8FAFC'
                    },
                    fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] },
                }
            }
        }
    </script>
    <style>
        #search-results::-webkit-scrollbar { width: 4px; }
        #search-results::-webkit-scrollbar-track { background: transparent; }
        #search-results::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 2px; }
        #wiki-body::-webkit-scrollbar { width: 4px; }
        #wiki-body::-webkit-scrollbar-track { background: transparent; }
        #wiki-body::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 2px; }
        #wiki-editor::-webkit-scrollbar { width: 4px; }
        #wiki-editor::-webkit-scrollbar-track { background: transparent; }
        #wiki-editor::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 2px; }
        .btn-tool {
            display: inline-flex;
            align-items: center;
            padding: 0.375rem 0.625rem;
            font-size: 0.75rem;
            border-radius: 0.5rem;
            color: #ffffff;
            transition: all 0.15s;
            cursor: pointer;
            border: none;
            white-space: nowrap;
        }
        .btn-tool:hover {
            filter: brightness(0.9);
        }
    </style>
</head>
<body class="bg-gray-50 font-sans text-gray-800 min-h-screen flex flex-col">
    <!-- 顶部导航 -->
    <header class="bg-white shadow-sm sticky top-0 z-50 border-b border-gray-200">
        <div class="container mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="w-8 h-8 rounded-lg bg-primary/10 flex items-center justify-center">
                    <i class="fa fa-book text-primary"></i>
                </div>
                <h1 class="text-xl font-bold text-dark">Danbooru 标签查询</h1>
            </div>
            <div class="flex items-center gap-2">
                <button class="btn-tool bg-primary hover:bg-primary/90" onclick="runSyncTags()" title="同步标签库">
                    <i class="fa fa-database"></i><span class="hidden sm:inline ml-1">同步数据库</span>
                </button>
                <button class="btn-tool bg-secondary hover:bg-secondary/90" onclick="runCrawlGroups()" title="爬取分组">
                    <i class="fa fa-folder-open"></i><span class="hidden sm:inline ml-1">爬取分组</span>
                </button>
                <button class="btn-tool bg-indigo-500 hover:bg-indigo-600" onclick="runFetchCooc()" title="爬取共现">
                    <i class="fa fa-link"></i><span class="hidden sm:inline ml-1">爬取共现</span>
                </button>
                <button id="btn-update" class="btn-tool bg-accent hover:bg-accent/90" onclick="runUpdate()">
                    <i class="fa fa-refresh mr-1"></i> 增量更新
                </button>
                <button class="btn-tool bg-cyan-500 hover:bg-cyan-600" onclick="runLLMProcess()" title="批量 LLM 深度翻译">
                    <i class="fa fa-magic"></i><span class="hidden sm:inline ml-1">批量深度翻译</span>
                </button>
                <div class="w-px h-5 bg-gray-200 mx-0.5"></div>
                <a href="/tag_editor" class="flex items-center justify-center bg-white hover:bg-gray-50 text-gray-600 font-medium py-1.5 px-3 rounded-lg transition-all text-xs border border-gray-300">
                    <i class="fa fa-tags mr-1.5"></i> 标签编辑
                </a>
                <a href="/img_editor" class="flex items-center justify-center bg-white hover:bg-gray-50 text-gray-600 font-medium py-1.5 px-3 rounded-lg transition-all text-xs border border-gray-300">
                    <i class="fa fa-crop mr-1.5"></i> 图片编辑
                </a>
            </div>
        </div>
    </header>

    <!-- 主内容 -->
    <main class="flex-grow container mx-auto px-4 py-4">
        <!-- 搜索栏 + 工具按钮 -->
        <div class="bg-white rounded-lg shadow-sm border border-gray-200 p-4 mb-4 relative">
            <div class="flex items-center gap-2">
                <div class="max-w-lg flex-1 relative">
                    <i class="fa fa-search absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
                    <input id="search-input" type="text" autocomplete="off" class="w-full pl-9 pr-3 py-2 border border-gray-300 rounded-lg text-sm focus:outline-none focus:border-primary transition-colors" placeholder="搜索标签（英文/中文/别名）..." oninput="debouncedLiveSearch()" onkeydown="if(event.key==='Enter')openFirstResult()">
                </div>
                <button class="px-4 py-2 bg-primary hover:bg-primary/90 text-white rounded-lg text-sm font-medium transition-colors shrink-0" onclick="openFirstResult()">
                    <i class="fa fa-search mr-1"></i>搜索
                </button>
            </div>
            <!-- 下拉搜索结果 -->
            <div id="search-dropdown" class="hidden absolute left-4 right-4 top-full mt-1 bg-white rounded-lg shadow-xl border border-gray-200 max-h-80 overflow-y-auto z-50">
                <div id="search-results"></div>
            </div>
        </div>

        <div style="height:calc(100vh - 140px)">
            <div class="h-full bg-gray-100 rounded-lg shadow-sm border border-gray-200 flex flex-col overflow-hidden">
                <div id="detail-empty" class="flex-grow overflow-y-auto p-4 bg-white">
                    <div class="flex flex-wrap gap-2" id="random-tags"></div>
                    <div id="random-loading" class="text-center text-gray-400 text-sm py-8"><i class="fa fa-spinner fa-spin mr-1"></i>加载推荐标签...</div>
                </div>
                <div id="detail-card" class="hidden flex-grow flex overflow-hidden">
                    <!-- 左栏：标签信息 -->
                    <div class="w-64 shrink-0 border-r border-gray-300 overflow-y-auto p-4 bg-white flex flex-col gap-2.5">
                        <div>
                            <h2 id="d-name" class="text-lg font-bold text-dark break-all"></h2>
                            <a id="d-danbooru-link" href="#" target="_blank" class="text-xs text-primary hover:text-primary/80 inline-flex items-center gap-0.5 hidden" title="在 Danbooru 官方查看该标签的完整 wiki">
                                <i class="fa fa-external-link"></i> Danbooru
                            </a>
                            <div class="flex items-center gap-1">
                                <span id="d-cn-name" class="text-sm text-gray-700"></span>
                                <input id="d-cn-input" type="text" class="hidden flex-1 text-sm border border-gray-300 rounded px-2 py-0.5 focus:outline-none focus:border-primary min-w-0" placeholder="输入中文名">
                                <button id="d-cn-edit-btn" class="text-xs text-gray-500 hover:text-gray-700 hidden" onclick="enterCnNameEdit()" title="编辑中文名">
                                    <i class="fa fa-pencil"></i>
                                </button>
                                <button id="d-cn-save-btn" class="hidden text-xs text-secondary hover:text-secondary/80" onclick="saveCnName()" title="保存中文名">
                                    <i class="fa fa-check"></i>
                                </button>
                                <button id="d-cn-cancel-btn" class="hidden text-xs text-gray-500 hover:text-gray-700" onclick="cancelCnNameEdit()" title="取消">
                                    <i class="fa fa-times"></i>
                                </button>
                                <button id="d-cn-lock-btn" class="text-xs text-gray-500 hover:text-gray-700 hidden" onclick="toggleCnLock()" title="切换中文名锁定状态">
                                    <i id="d-cn-lock-icon" class="fa"></i>
                                </button>
                            </div>
                        </div>
                        <div class="flex items-center gap-2 flex-wrap">
                            <span id="d-category" class="hidden px-2 py-0.5 text-xs rounded-full bg-blue-100 text-blue-700"></span>
                            <span id="d-post-count" class="hidden text-xs text-gray-700"></span>
                        </div>
                        <div id="d-other-names-wrap" class="hidden text-xs text-gray-600 flex flex-wrap items-start gap-x-1 gap-y-0.5">
                            <span class="shrink-0 font-semibold">别名：</span><span id="d-other-names" class="font-medium text-gray-700 break-words"></span>
                        </div>
                        <div id="d-ext-cn-wrap" class="hidden text-xs text-gray-600 flex flex-wrap items-start gap-x-1 gap-y-0.5">
                            <span class="shrink-0 font-semibold">拓展：</span><span id="d-ext-cn" class="font-medium text-gray-700 break-words"></span>
                        </div>
                        <div id="d-tag-groups-wrap" class="hidden flex flex-wrap items-start gap-x-1 gap-y-0.5 text-xs">
                            <span class="text-gray-500 shrink-0 font-semibold">分组：</span>
                            <span id="d-tag-groups" class="flex flex-wrap gap-1"></span>
                        </div>
                        <div id="d-cooc-wrap" class="hidden border-t border-gray-100 pt-2">
                            <div class="flex flex-wrap items-start gap-x-1 gap-y-0.5 text-xs text-gray-600">
                                <span class="shrink-0 font-semibold">相关标签：</span>
                                <span id="d-cooc-list" class="flex flex-wrap gap-1"></span>
                            </div>
                        </div>
                    </div>
                    <!-- 右栏：Wiki -->
                    <div class="flex-1 flex flex-col overflow-hidden">
                        <div class="px-4 py-2 border-b border-gray-200 flex gap-2 shrink-0 bg-white">
                            <button id="wiki-tab-en" class="px-3 py-1 text-sm bg-primary text-white rounded-lg" onclick="switchWikiTab('en')">英文 Wiki</button>
                            <button id="wiki-tab-zh" class="px-3 py-1 text-sm bg-gray-100 hover:bg-gray-200 text-gray-600 rounded-lg" onclick="switchWikiTab('zh')">中文 Wiki</button>
                            <button id="d-wiki-lock-btn" class="text-xs text-gray-400 hover:text-gray-600 hidden self-center" onclick="toggleWikiLock()" title="切换中文 wiki 锁定状态">
                                <i id="d-wiki-lock-icon" class="fa"></i>
                            </button>
                            <button id="wiki-translate-btn" class="hidden px-3 py-1.5 text-sm bg-primary hover:bg-primary/90 text-white rounded-lg transition-colors ml-auto" onclick="translateWiki()">
                                <i class="fa fa-language mr-1"></i>深度翻译
                            </button>
                            <button id="wiki-edit-btn" class="px-3 py-1.5 text-sm bg-gray-100 hover:bg-gray-200 text-gray-700 rounded-lg transition-colors" onclick="enterWikiEditMode()">
                                <i class="fa fa-pencil mr-1"></i>编辑
                            </button>
                        </div>
                        <div id="wiki-body" class="flex-1 overflow-y-auto px-4 py-3 text-sm text-gray-700">
                            <div id="wiki-view" class="min-h-[120px] leading-relaxed"></div>
                            <textarea id="wiki-editor" class="hidden w-full h-[calc(100vh-320px)] min-h-[160px] border border-gray-300 rounded-lg p-3 text-sm font-mono focus:outline-none focus:border-primary resize-none"></textarea>
                        </div>
                        <div id="wiki-action-row" class="flex justify-end gap-2 px-4 py-2 border-t border-gray-200 shrink-0">
                            <button id="wiki-save-btn" class="hidden px-3 py-1.5 text-sm bg-secondary hover:bg-secondary/90 text-white rounded-lg transition-colors" onclick="saveWiki()">
                                <i class="fa fa-check mr-1"></i>保存
                            </button>
                            <button id="wiki-cancel-btn" class="hidden px-3 py-1.5 text-sm bg-gray-100 hover:bg-gray-200 text-gray-700 rounded-lg transition-colors" onclick="cancelWikiEdit()">
                                <i class="fa fa-times mr-1"></i>取消
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- 标签组弹窗 -->
    <div id="tag-group-modal" class="fixed inset-0 bg-black/50 z-[60] flex items-center justify-center hidden">
        <div class="bg-white rounded-xl shadow-2xl w-[520px] max-h-[80vh] flex flex-col">
            <div class="flex items-center justify-between px-6 py-4 border-b border-gray-200 shrink-0">
                <h3 id="tgm-title" class="text-lg font-semibold text-gray-800"></h3>
                <button class="text-gray-400 hover:text-gray-600 text-xl leading-none" onclick="closeGroupModal()">&times;</button>
            </div>
            <div id="tgm-count" class="px-6 py-2 text-xs text-gray-400 shrink-0"></div>
            <div id="tgm-list" class="flex-1 overflow-y-auto px-6 py-3">
                <div class="flex flex-wrap gap-1.5"></div>
            </div>
            <div class="px-6 py-3 border-t border-gray-200 shrink-0 flex justify-end">
                <button class="px-4 py-2 text-sm bg-gray-100 hover:bg-gray-200 text-gray-700 rounded-lg transition-colors" onclick="closeGroupModal()">关闭</button>
            </div>
        </div>
    </div>

    <!-- 进度弹窗（增量更新用） -->
    <div id="progress-modal" class="fixed inset-0 bg-black/50 z-[60] flex items-center justify-center hidden">
        <div class="bg-white rounded-xl shadow-2xl w-[480px] p-6">
            <h3 id="progress-title" class="text-lg font-semibold text-gray-800 mb-1">处理中</h3>
            <p id="progress-subtitle" class="text-sm text-gray-400 mb-4"></p>
            <div class="w-full bg-gray-200 rounded-full h-3 mb-3 overflow-hidden">
                <div id="progress-bar" class="bg-primary h-3 rounded-full transition-all duration-300 ease-out" style="width: 0%"></div>
            </div>
            <div class="flex justify-between text-sm text-gray-500 mb-3">
                <span id="progress-count"></span>
                <span id="progress-percent"></span>
            </div>
            <div class="text-sm text-gray-600 mb-2 truncate" id="progress-item"></div>
            <div id="progress-errors" class="hidden max-h-32 overflow-y-auto text-sm text-red-600 bg-red-50 rounded-lg p-3 mb-4 space-y-1"></div>
            <div class="flex justify-end gap-2">
                <button id="progress-cancel-btn" class="px-4 py-2 text-sm bg-gray-100 hover:bg-gray-200 text-gray-700 rounded-lg transition-colors" onclick="cancelProgress()">中断</button>
                <button id="progress-close-btn" class="hidden px-4 py-2 text-sm bg-primary hover:bg-primary/90 text-white rounded-lg transition-colors" onclick="closeProgressModal()">关闭</button>
            </div>
        </div>
    </div>

    <!-- 通知 -->
    <div id="notification" class="fixed bottom-5 right-5 px-5 py-3 rounded-lg shadow-lg transform translate-y-20 opacity-0 transition-all duration-300 flex items-center z-50 text-sm"></div>

    <script>
        // === DText（Danbooru wiki 标记）渲染器 ===
        // 解析 Danbooru 的 DText 格式为安全 HTML：
        //   [[tag]]        → 可点击链接（在本页搜索该标签）
        //   !post #12345   → 图片缩略图（链接到 Danbooru 帖子页，联网显示缩略图）
        //   h4. heading    → 加粗标题
        //   * item         → 无序列表
        function renderDText(text) {
            if (!text) return '';
            var lines = text.split('\n');
            var html = [], inList = false, inPostSection = false;

            function closePostSection() {
                if (inPostSection) {
                    html.push('</div>');
                    inPostSection = false;
                }
            }

            for (var i = 0; i < lines.length; i++) {
                var line = lines[i];
                line = line.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                var heading = line.match(/^h([456])\.\s+(.*)/);
                if (heading) {
                    closePostSection();
                    if (inList) { html.push('</ul>'); inList = false; }
                    var hLevel = heading[1];
                    var hText = heading[2];
                    var hClass = hLevel === '4' ? 'font-semibold text-gray-800 mt-3 mb-1' :
                                 hLevel === '5' ? 'font-semibold text-gray-700 mt-2 mb-0.5' :
                                                  'font-semibold text-gray-600 mt-1 mb-0.5';
                    html.push('<h' + hLevel + ' class="' + hClass + '">' + _dtextInline(hText) + '</h' + hLevel + '>');
                    continue;
                }
                var nestedLi = line.match(/^\*\*\s+(.*)/);
                if (nestedLi) {
                    closePostSection();
                    if (!inList) { html.push('<ul class="list-disc ml-5 my-1">'); inList = true; }
                    html.push('<li class="ml-6">' + _dtextInline(nestedLi[1]) + '</li>');
                    continue;
                }
                var li = line.match(/^\*\s+(.*)/);
                if (li) {
                    var content = li[1];
                    var postMatch = content.match(/^!\s*post\s*#(\d+)[:\s]*/);
                    var assetMatch = content.match(/^!\s*asset\s*#(\d+)[:\s]*/);
                    if (postMatch || assetMatch) {
                        // 图片贴预览行 → 卡片横排（图片在上，标签在下）
                        if (inList) { html.push('</ul>'); inList = false; }
                        if (!inPostSection) {
                            html.push('<div class="flex flex-wrap gap-12 my-2">');
                            inPostSection = true;
                        }
                        var mediaId = postMatch ? postMatch[1] : assetMatch[1];
                        var isAsset = !!assetMatch;
                        var caption = content.slice((postMatch || assetMatch)[0].length);
                        html.push('<div class="flex flex-col items-center" style="max-width:220px">');
                        html.push('<div class="flex items-center justify-center w-full" style="height:220px">');
                        var mediaUrl = isAsset
                            ? 'https://danbooru.donmai.us/media_assets/' + mediaId
                            : 'https://danbooru.donmai.us/posts/' + mediaId;
                        html.push('<a href="' + mediaUrl + '" target="_blank">');
                        html.push('<img data-media-id="' + mediaId + '" ' +
                                  (isAsset ? 'data-media-type="asset"' : 'data-media-type="post"') + ' ' +
                                  'class="dtext-post-thumb max-h-[220px] max-w-full w-auto h-auto" ' +
                                  'style="display:none" loading="lazy" ' +
                                  'onerror="this.style.display=\'none\'"></a>');
                        html.push('</div>');
                        html.push('<div class="text-xs mt-1 text-center leading-snug">' + _dtextInline(caption) + '</div>');
                        html.push('</div>');
                        continue;
                    }
                    closePostSection();
                    if (!inList) { html.push('<ul class="list-disc ml-5 my-1">'); inList = true; }
                    html.push('<li>' + _dtextInline(content) + '</li>');
                    continue;
                }
                closePostSection();
                if (line.trim() === '') {
                    if (inList) { html.push('</ul>'); inList = false; }
                    html.push('');
                    continue;
                }
                if (inList) { html.push('</ul>'); inList = false; }
                html.push('<p class="my-1">' + _dtextInline(line) + '</p>');
            }
            closePostSection();
            if (inList) html.push('</ul>');
            return html.join('\n');
        }
        function _dtextInline(text) {
            // 行内标记：[b]粗体[/b] [i]斜体[/i] [s]删除线[/s] [u]下划线[/u]
            text = text.replace(/\[b\]([\s\S]*?)\[\/b\]/g, '<strong>$1</strong>');
            text = text.replace(/\[i\]([\s\S]*?)\[\/i\]/g, '<em>$1</em>');
            text = text.replace(/\[s\]([\s\S]*?)\[\/s\]/g, '<s>$1</s>');
            text = text.replace(/\[u\]([\s\S]*?)\[\/u\]/g, '<u>$1</u>');
            // 外部链接 "显示文本":url 或 "显示文本":[url]
            text = text.replace(/"([^"]+)"\s*:\s*\[?(https?:\/\/[^\s<>"'\]]+)\]?/g, function(_, label, url) {
                url = url.replace(/[\[\]]/g, '');
                return '<a href="' + url + '" target="_blank" rel="noopener noreferrer" class="text-primary underline hover:text-primary/80">' + label + '</a>';
            });
            text = text.replace(/\[\[([^\]]+)\]\]/g, function(_, inner) {
                var parts = inner.split('|');
                var tag = parts[0].trim();
                var display = (parts[1] || parts[0]).trim();
                var isGroup = tag.match(/^tag\s*group[:_]/i);
                var cls = isGroup
                    ? 'text-orange-600 underline hover:text-orange-500'
                    : 'text-primary underline hover:text-primary/80';
                return '<a href="#" class="' + cls + '" onclick="dtextSearchTag(\'' + encodeURIComponent(tag) + '\');return false;">' + display + '</a>';
            });
            // {{tag}} → 行内标签语法，与 [[tag]] 相同处理
            text = text.replace(/\{\{([^}]+)\}\}/g, function(_, inner) {
                var tag = inner.trim();
                var isGroup = tag.match(/^tag\s*group[:_]/i);
                var cls = isGroup
                    ? 'text-orange-600 underline hover:text-orange-500'
                    : 'text-primary underline hover:text-primary/80';
                return '<a href="#" class="' + cls + '" onclick="dtextSearchTag(\'' + encodeURIComponent(tag) + '\');return false;">' + tag + '</a>';
            });
            text = text.replace(/!\s*(post|asset)\s*#(\d+)/g, function(_, type, id) {
                var isAsset = type.toLowerCase() === 'asset';
                var url = isAsset ? 'https://danbooru.donmai.us/media_assets/' + id : 'https://danbooru.donmai.us/posts/' + id;
                return '<a href="' + url + '" target="_blank" class="inline-block">' +
                    '<img data-media-id="' + id + '" data-media-type="' + type + '" ' +
                    'class="dtext-post-thumb inline-block rounded border border-gray-200 max-w-[100px] max-h-[100px] align-middle my-0.5" ' +
                    'loading="lazy" alt="' + type + ' #' + id + '" style="display:none" ' +
                    'onerror="this.style.display=\'none\'"></a>';
            });
            return text;
        }
        // DText 链接点击：跳转到标签详情或标签组弹窗
        function dtextSearchTag(tag) {
            tag = decodeURIComponent(tag);
            // 检测标签组链接（如 [[tag group:character count]]）
            if (tag.match(/^tag\s*group[:_]/i)) {
                var groupId = tag.replace(/^tag\s*group[:_]\s*/i, 'tag_group:').replace(/ /g, '_');
                showGroupTags(groupId);
                return;
            }
            showTagDetail(tag);
        }
        // DText 图片懒加载：用 Danbooru API 获取大图 URL
        function _dtextLoadThumbnails(container) {
            var imgs = (container || document).querySelectorAll('.dtext-post-thumb[data-media-id]');
            imgs.forEach(function(img) {
                if (img.dataset.loaded) return;
                img.dataset.loaded = '1';
                var mediaId = img.dataset.mediaId;
                var mediaType = img.dataset.mediaType || 'post';
                if (mediaType === 'asset') {
                    // !asset: 依次尝试 posts 搜索 → media_assets API → fallback 图标
                    _loadAssetThumbnail(img, mediaId);
                } else {
                    fetch('https://danbooru.donmai.us/posts/' + mediaId + '.json')
                        .then(function(r) { return r.json(); })
                        .then(function(data) {
                            var src = data.large_file_url || data.preview_file_url || data.url;
                            if (src) {
                                img.src = src;
                                img.style.display = '';
                            } else {
                                img.style.display = 'none';
                            }
                        })
                        .catch(function() { img.style.display = 'none'; });
                }
            });
        }
        function _loadAssetThumbnail(img, mediaId) {
            // 尝试1: posts 搜索（media_asset_id）
            fetch('https://danbooru.donmai.us/posts.json?tags=media_asset_id:' + mediaId + '&limit=1')
                .then(function(r) { return r.json(); })
                .then(function(data) {
                    var post = Array.isArray(data) ? data[0] : null;
                    if (post && post.large_file_url) {
                        img.src = post.large_file_url;
                        img.style.display = '';
                        return;
                    }
                    // 尝试2: media_assets API
                    fetch('https://danbooru.donmai.us/media_assets/' + mediaId + '.json')
                        .then(function(r2) { return r2.json(); })
                        .then(function(data2) {
                            var ma = data2.media_asset || data2;
                            var src = null;
                            if (ma.variant_download_urls) {
                                var v = ma.variant_download_urls;
                                src = v.preview || v['180x180'] || v.large || v.original;
                            }
                            if (!src) src = ma.large_file_url || ma.preview_file_url || ma.file_url;
                            if (!src && ma.md5 && ma.file_ext) {
                                src = 'https://cdn.donmai.us/preview/' + ma.md5.substring(0,2) + '/' + ma.md5.substring(2,4) + '/' + ma.md5 + '.' + ma.file_ext;
                            }
                            if (src) {
                                img.src = src;
                                img.style.display = '';
                            } else {
                                img.style.display = 'none';
                            }
                        })
                        .catch(function() { img.style.display = 'none'; });
                })
                .catch(function() { img.style.display = 'none'; });
        }

        let _detailState = {tag: '', enWiki: '', cnWiki: '', tab: 'en'};
        let _searchSeq = 0;  // 搜索序列守卫，丢弃过期响应避免快速搜索时旧结果覆盖新结果
        // 搜索结果增量渲染：FTS 后可一次取数百条，但一次性渲染全部 DOM 节点（滚动卡顿）。
        // 改为「先渲染前 N 条，滚动到底部时再追加下一批」，保持 DOM 节点数受控、滚动流畅。
        let _searchResults = [];   // 当前搜索的完整结果（未渲染部分待滚动加载）
        let _searchRendered = 0;   // 已渲染条数
        const SEARCH_PAGE_SIZE = 50;  // 每次增量渲染的条数

        // 渲染单条结果项（复用，避免重复 HTML 拼接逻辑）
        function _renderSearchItem(item) {
            const cn = (item.cn_name || '').split(',')[0];
            const pc = item.post_count > 0 ? '<span class="text-xs text-gray-400 ml-1">' + (item.post_count >= 1000 ? (item.post_count/1000).toFixed(0)+'k' : item.post_count) + '次</span>' : '';
            return '<div class="px-3 py-2 border-b border-gray-100 hover:bg-primary/5 cursor-pointer transition-colors" onclick="showTagDetail(\'' + encodeURIComponent(item.name) + '\');closeSearchDropdown()">'
                + '<div class="flex items-baseline justify-between">'
                + '<span class="font-medium text-sm text-gray-800 truncate">' + escapeHtml(item.name) + '</span>'
                + pc
                + '</div>'
                + (cn ? '<span class="text-xs text-gray-500 truncate block">' + escapeHtml(cn) + '</span>' : '')
                + '</div>';
        }
        // 增量追加下一批结果（滚动到底部时调用）
        function appendSearchResults() {
            if (_searchRendered >= _searchResults.length) return;
            const resultsEl = document.getElementById('search-results');
            const chunk = _searchResults.slice(_searchRendered, _searchRendered + SEARCH_PAGE_SIZE);
            // appendChild 避免重建已有节点（innerHTML 会重渲染全部，丢失滚动位置）
            const frag = document.createElement('div');
            frag.innerHTML = chunk.map(_renderSearchItem).join('');
            while (frag.firstChild) resultsEl.appendChild(frag.firstChild);
            _searchRendered += chunk.length;
        }

        // === 搜索 ===
        function openSearchDropdown() { document.getElementById('search-dropdown').classList.remove('hidden'); }
        function closeSearchDropdown() { document.getElementById('search-dropdown').classList.add('hidden'); }
        // 点击搜索栏外部关闭下拉
        document.addEventListener('click', function(e) {
            const dropdown = document.getElementById('search-dropdown');
            const searchBox = e.target.closest('.relative');
            if (!dropdown.contains(e.target) && !searchBox) closeSearchDropdown();
        });

        // 输入时实时搜索（防抖 200ms），空输入时关闭下拉
        function debounce(fn, wait) {
            let timer = null;
            return function() {
                clearTimeout(timer);
                const args = arguments, ctx = this;
                timer = setTimeout(function() { fn.apply(ctx, args); }, wait);
            };
        }
        function liveSearch() {
            const keyword = document.getElementById('search-input').value.trim();
            if (!keyword) { closeSearchDropdown(); _searchResults = []; return; }
            searchTags();
        }
        var debouncedLiveSearch = debounce(liveSearch, 200);

        // 回车/搜索按钮：按搜索框内容打开标签详情
        function openFirstResult() {
            const tag = document.getElementById('search-input').value.trim();
            if (!tag) {
                document.getElementById('detail-card').classList.add('hidden');
                document.getElementById('detail-empty').classList.remove('hidden');
                document.getElementById('search-dropdown').classList.add('hidden');
                return;
            }
            showTagDetail(tag);
            closeSearchDropdown();
        }

        // ── 随机标签（首页推荐） ──
        function loadRandomTags() {
            fetch('/danbooru_random?n=60')
                .then(r => r.json())
                .then(data => {
                    document.getElementById('random-loading').classList.add('hidden');
                    const container = document.getElementById('random-tags');
                    if (!data.tags || !data.tags.length) {
                        container.innerHTML = '<div class="text-center text-gray-300 text-sm py-8">暂无推荐标签</div>';
                        return;
                    }
                    container.innerHTML = data.tags.map(function(t) {
                        var cn = (t.cn_name || '').split(',')[0].trim();
                        return '<button onclick="showTagDetail(\'' + encodeURIComponent(t.name) + '\')" ' +
                            'class="group flex flex-col items-start gap-0.5 px-3 py-2 rounded-lg border border-gray-200 hover:border-primary/40 hover:bg-primary/5 transition-colors text-left">' +
                            '<span class="text-sm font-medium text-gray-700 group-hover:text-primary break-all w-full">' + escapeHtml(t.name) + '</span>' +
                            (cn ? '<span class="text-xs text-gray-600 break-all w-full">' + escapeHtml(cn) + '</span>' : '') +
                            '</button>';
                    }).join('');
                })
                .catch(function() {
                    document.getElementById('random-loading').textContent = '加载失败';
                });
        }

        function searchTags() {
            const keyword = document.getElementById('search-input').value.trim();
            if (!keyword) return;
            const seq = ++_searchSeq;
            const resultsEl = document.getElementById('search-results');
            resultsEl.innerHTML = '<div class="p-4 text-center text-gray-400 text-sm"><i class="fa fa-spinner fa-spin mr-1"></i>搜索中...</div>';
            openSearchDropdown();

            fetch('/danbooru_search', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({keyword: keyword, limit: 200})
            })
            .then(r => r.json())
            .then(data => {
                if (seq !== _searchSeq) return;  // 过期响应（用户已发起新搜索），丢弃
                if (data.error) {
                    resultsEl.innerHTML = '<div class="p-4 text-center text-red-400 text-sm">' + data.error + '</div>';
                    return;
                }
                const results = data.results || [];
                if (results.length === 0) {
                    _searchResults = []; _searchRendered = 0;
                    resultsEl.innerHTML = '<div class="p-4 text-center text-gray-300 text-sm">无匹配标签</div>';
                    return;
                }
                // 存完整结果，先渲染首页，剩余滚动时增量加载
                _searchResults = results;
                _searchRendered = 0;
                resultsEl.innerHTML = '';
                appendSearchResults();
            })
            .catch(() => {
                if (seq !== _searchSeq) return;
                resultsEl.innerHTML = '<div class="p-4 text-center text-red-400 text-sm">请求失败</div>';
            });
        }

        // 滚动加载：下拉结果滚到底部时追加下一批
        document.getElementById('search-dropdown').addEventListener('scroll', function() {
            if (_searchRendered >= _searchResults.length) return;  // 已全部渲染
            if (this.scrollHeight - this.scrollTop - this.clientHeight < 80) {
                appendSearchResults();
            }
        });

        // === 标签详情 ===
        function showTagDetail(tag) {
            try { tag = decodeURIComponent(tag); } catch (e) {}  // 安全解码，非 URI 编码的字符串原样保留
            // 同步搜索框：打开任何详情时都把标签名写入搜索框，
            // 确保搜索框始终反映当前查看的标签，后续操作基于搜索框内容
            document.getElementById('search-input').value = tag;
            fetch('/tag_detail/' + encodeURIComponent(tag))
                .then(r => r.json())
                .then(data => {
                    if (data.error) { showNotification('加载失败：' + data.error, 'error'); return; }
                    renderDetail(data);
                })
                .catch(() => showNotification('请求失败', 'error'));
        }

        function renderDetail(data) {
            // 加载新标签前，先确保退出编辑态（隐藏 textarea、显示只读视图）
            if (typeof _wikiEditing !== 'undefined' && _wikiEditing) {
                _wikiEditing = false;
                document.getElementById('wiki-editor').classList.add('hidden');
                document.getElementById('wiki-view').classList.remove('hidden');
            }
            // 退出 cn_name 编辑态
            if (_cnNameEditing) cancelCnNameEdit();
            _detailState = {tag: data.tag, enWiki: data.en_wiki || '', cnWiki: data.cn_wiki || '', tab: 'en', tagFound: data.post_count !== undefined};
            document.getElementById('detail-empty').classList.add('hidden');
            document.getElementById('detail-card').classList.remove('hidden');

            document.getElementById('d-name').textContent = data.tag;
            // 设置 Danbooru 官方 wiki 跳转链接
            const dbLink = document.getElementById('d-danbooru-link');
            dbLink.href = 'https://danbooru.donmai.us/wiki_pages/' + encodeURIComponent(data.tag);
            dbLink.classList.remove('hidden');
            const cnName = (data.cn_name || '').split(',')[0].trim();
            document.getElementById('d-cn-name').textContent = cnName;
            // cn_name 有值时显示编辑按钮
            const cnEditBtn = document.getElementById('d-cn-edit-btn');
            cnEditBtn.classList.toggle('hidden', !cnName);
            // 分类标签 + 使用次数
            const catMap = {0: '通用', 1: '艺术家', 3: '版权', 4: '角色', 5: '元数据'};
            const catBadge = document.getElementById('d-category');
            const catName = catMap[data.category];
            if (catName) {
                catBadge.textContent = catName;
                catBadge.classList.remove('hidden');
            } else {
                catBadge.classList.add('hidden');
            }
            const pcEl = document.getElementById('d-post-count');
            if (data.post_count > 0) {
                pcEl.textContent = data.post_count.toLocaleString() + ' 次';
                pcEl.classList.remove('hidden');
            } else {
                pcEl.classList.add('hidden');
            }

            // 别名（other_names 为 JSON 数组字符串）
            const onw = document.getElementById('d-other-names-wrap');
            let names = [];
            try { names = JSON.parse(data.other_names || '[]'); } catch(e) {}
            if (names.length) {
                onw.classList.remove('hidden');
                onw.classList.add('flex');
                document.getElementById('d-other-names').textContent = names.join('、');
            } else {
                onw.classList.add('hidden');
                onw.classList.remove('flex');
            }

            // 拓展名（cn_name 逗号分隔的第二项起）
            const extWrap = document.getElementById('d-ext-cn-wrap');
            const extEl = document.getElementById('d-ext-cn');
            const cnParts = (data.cn_name || '').split(',').map(function(s) { return s.trim(); }).filter(Boolean);
            if (cnParts.length > 1) {
                extWrap.classList.remove('hidden');
                extWrap.classList.add('flex');
                extEl.textContent = cnParts.slice(1).join('、');
            } else {
                extWrap.classList.add('hidden');
                extWrap.classList.remove('flex');
            }

            // 标签组
            const tgWrap = document.getElementById('d-tag-groups-wrap');
            const tgEl = document.getElementById('d-tag-groups');
            if (data.tag_groups && data.tag_groups.length > 0) {
                tgWrap.classList.remove('hidden');
                tgWrap.classList.add('flex');
                tgEl.innerHTML = data.tag_groups.map(g =>
                    '<button onclick="showGroupTags(\'' + encodeURIComponent(g.id) + '\')" ' +
                    'class="px-1.5 py-0.5 bg-gray-100 hover:bg-primary/10 text-gray-600 hover:text-primary rounded text-xs transition-colors" ' +
                    'title="点击查看分组标签">' +
                    (g.cn_name || g.id.replace('tag_group:', '')) + '</button>'
                ).join('');
            } else {
                tgWrap.classList.add('hidden');
                tgWrap.classList.remove('flex');
            }

            // ── 锁状态（必须在 switchWikiTab 之前设置，否则 refreshActionButtons 读到 undefined）──
            _detailState.cnNameLocked = data.cn_name_locked || 0;
            _detailState.cnWikiLocked = data.cn_wiki_locked || 0;
            _updateLockIcons();

            switchWikiTab('en');
            // 加载共现标题栏（列表折叠，点击才加载数据）
            loadCooc(data.tag);

            // 标签未收录到数据库（无 post_count）时隐藏深度翻译/编辑/锁按钮
            if (data.post_count === undefined) {
                document.getElementById('wiki-translate-btn').classList.add('hidden');
                document.getElementById('wiki-edit-btn').classList.add('hidden');
                document.getElementById('d-wiki-lock-btn').classList.add('hidden');
                document.getElementById('d-cn-lock-btn').classList.add('hidden');
            }
        }

        function _updateLockIcons() {
            // cn_name 锁
            const nameLockBtn = document.getElementById('d-cn-lock-btn');
            const nameIcon = document.getElementById('d-cn-lock-icon');
            const cnEditBtn = document.getElementById('d-cn-edit-btn');
            if (_detailState.cnNameLocked !== undefined) {
                // 标签未收录时不显示锁图标
                if (_detailState.tagFound === false) {
                    nameLockBtn.classList.add('hidden');
                    nameLockBtn.classList.remove('inline-block');
                } else {
                    nameLockBtn.classList.remove('hidden');
                    nameLockBtn.classList.add('inline-block');
                }
                const locked = _detailState.cnNameLocked;
                nameIcon.className = 'fa ' + (locked ? 'fa-lock text-amber-500' : 'fa-unlock text-gray-300');
                nameLockBtn.title = locked ? '已锁定，点击解锁' : '已解锁，点击锁定';
                // 锁定后编辑按钮不可用
                cnEditBtn.classList.toggle('hidden', locked || !document.getElementById('d-cn-name').textContent);
                if (locked) cnEditBtn.title = '中文名已锁定';
                else cnEditBtn.title = '编辑中文名';
            }
            // cn_wiki 锁
            const wikiLockBtn = document.getElementById('d-wiki-lock-btn');
            const wikiIcon = document.getElementById('d-wiki-lock-icon');
            if (_detailState.cnWikiLocked !== undefined) {
                // 标签未收录时不显示锁图标
                if (_detailState.tagFound === false) {
                    wikiLockBtn.classList.add('hidden');
                    wikiLockBtn.classList.remove('inline-block');
                } else {
                    wikiLockBtn.classList.remove('hidden');
                    wikiLockBtn.classList.add('inline-block');
                }
                const locked = _detailState.cnWikiLocked;
                wikiIcon.className = 'fa ' + (locked ? 'fa-lock text-amber-500' : 'fa-unlock text-gray-300');
                wikiLockBtn.title = locked ? '已锁定，点击解锁' : '已解锁，点击锁定';
            }
            // 同步 wiki 编辑按钮状态
            if (typeof refreshActionButtons === 'function') refreshActionButtons();
        }

        let _cnNameEditing = false;

        function enterCnNameEdit() {
            if (_detailState.cnNameLocked) {
                showNotification('中文名已锁定，无法编辑', 'warning');
                return;
            }
            if (_cnNameEditing) return;
            _cnNameEditing = true;
            const span = document.getElementById('d-cn-name');
            const input = document.getElementById('d-cn-input');
            input.value = span.textContent;
            span.classList.add('hidden');
            input.classList.remove('hidden');
            document.getElementById('d-cn-edit-btn').classList.add('hidden');
            document.getElementById('d-cn-lock-btn').classList.add('hidden');
            document.getElementById('d-cn-save-btn').classList.remove('hidden');
            document.getElementById('d-cn-cancel-btn').classList.remove('hidden');
            input.focus();
            input.setSelectionRange(input.value.length, input.value.length);
        }

        function cancelCnNameEdit() {
            _cnNameEditing = false;
            document.getElementById('d-cn-input').classList.add('hidden');
            document.getElementById('d-cn-name').classList.remove('hidden');
            document.getElementById('d-cn-save-btn').classList.add('hidden');
            document.getElementById('d-cn-cancel-btn').classList.add('hidden');
            document.getElementById('d-cn-edit-btn').classList.remove('hidden');
            document.getElementById('d-cn-lock-btn').classList.remove('hidden');
        }

        function saveCnName() {
            const input = document.getElementById('d-cn-input');
            const trimmed = input.value.trim();
            if (!trimmed) { showNotification('中文名不能为空', 'warning'); return; }
            const saveBtn = document.getElementById('d-cn-save-btn');
            saveBtn.disabled = true;
            fetch('/update_cn_name', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({tag: _detailState.tag, cn_name: trimmed})
            })
            .then(r => r.json())
            .then(data => {
                saveBtn.disabled = false;
                if (data.error) { showNotification(data.error, 'error'); return; }
                document.getElementById('d-cn-name').textContent = trimmed;
                cancelCnNameEdit();
                showNotification('中文名已更新', 'success');
            })
            .catch(() => {
                saveBtn.disabled = false;
                showNotification('保存失败', 'error');
            });
        }

        function toggleCnLock() {
            _toggleLock('name');
        }

        function toggleWikiLock() {
            _toggleLock('wiki');
        }

        function _toggleLock(field) {
            fetch('/toggle_cn_lock', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({tag: _detailState.tag, field: field})
            })
            .then(r => r.json())
            .then(data => {
                if (data.error) { showNotification(data.error, 'error'); return; }
                if (field === 'name') _detailState.cnNameLocked = data.cn_locked;
                else _detailState.cnWikiLocked = data.cn_locked;
                _updateLockIcons();
                showNotification((field === 'name' ? '中文名' : '中文 Wiki ') + '已' + (data.cn_locked ? '锁定' : '解锁'), 'success');
            })
            .catch(() => showNotification('操作失败', 'error'));
        }

        let _wikiEditing = false;  // 是否处于编辑态（跨 tab 切换时强制退出）

        function switchWikiTab(lang) {
            // 切换 tab 时若处于编辑态，先退回只读态（放弃未保存改动，避免跨 tab 内容混淆）
            if (_wikiEditing) exitWikiEditMode(false);
            _detailState.tab = lang;
            const tabEn = document.getElementById('wiki-tab-en');
            const tabZh = document.getElementById('wiki-tab-zh');
            const view = document.getElementById('wiki-view');

            if (lang === 'en') {
                tabEn.className = 'px-3 py-1 text-sm bg-primary text-white rounded-lg';
                tabZh.className = 'px-3 py-1 text-sm bg-gray-100 hover:bg-gray-200 text-gray-600 rounded-lg';
                // 英文 wiki 用 DText 渲染（[[标签]]链接 + !post 图片）
                if (_detailState.enWiki) {
                    view.innerHTML = renderDText(_detailState.enWiki);
                    _dtextLoadThumbnails(view);
                } else {
                    view.textContent = '(该标签暂无英文 wiki)';
                }
            } else {
                tabZh.className = 'px-3 py-1 text-sm bg-primary text-white rounded-lg';
                tabEn.className = 'px-3 py-1 text-sm bg-gray-100 hover:bg-gray-200 text-gray-600 rounded-lg';
                if (_detailState.cnWiki) {
                    view.innerHTML = _dtextInline(_detailState.cnWiki
                        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'));
                } else if (_detailState.enWiki) {
                    view.textContent = '(暂无中文 wiki，可点击"翻译并保存"生成，或点"编辑"手写)';
                } else {
                    view.textContent = '(该标签暂无 wiki)';
                }
            }
            refreshActionButtons();
        }

        // 根据当前 tab 与内容状态，刷新底部操作按钮的显隐
        function refreshActionButtons() {
            const editBtn = document.getElementById('wiki-edit-btn');
            const saveBtn = document.getElementById('wiki-save-btn');
            const cancelBtn = document.getElementById('wiki-cancel-btn');
            const trBtn = document.getElementById('wiki-translate-btn');

            if (_wikiEditing) {
                // 编辑态：只露保存/取消
                editBtn.classList.add('hidden');
                saveBtn.classList.remove('hidden');
                cancelBtn.classList.remove('hidden');
                trBtn.classList.add('hidden');
                return;
            }
            saveBtn.classList.add('hidden');
            cancelBtn.classList.add('hidden');

            // 标签未收录到数据库时，始终隐藏深度翻译和编辑按钮
            if (_detailState.tagFound === false) {
                editBtn.classList.add('hidden');
                trBtn.classList.add('hidden');
                return;
            }

            // 编辑按钮：仅中文 tab + 未锁定时可编辑（英文 wiki 只读）
            editBtn.classList.toggle('hidden', _detailState.tab !== 'zh' || _detailState.cnWikiLocked);
            // 翻译并保存按钮：始终显示
            trBtn.classList.remove('hidden');
        }

        // ── 共现推荐（直接列出） ──────────────────────────────────────────────
        var _coocSeq = 0;

        function loadCooc(tag) {
            const seq = ++_coocSeq;
            const wrap = document.getElementById('d-cooc-wrap');
            const list = document.getElementById('d-cooc-list');
            list.innerHTML = '<span class="text-gray-300 text-xs"><i class="fa fa-spinner fa-spin mr-1"></i>加载中...</span>';
            wrap.classList.remove('hidden');
            fetch('/tag_cooc/' + encodeURIComponent(tag))
                .then(r => r.json())
                .then(data => {
                    if (seq !== _coocSeq) return;  // 过期响应，丢弃
                    if (data.cooc && data.cooc.length) {
                        list.innerHTML = data.cooc.map(c =>
                            '<button onclick="showTagDetail(\'' + encodeURIComponent(c.related) + '\')" ' +
                            'class="px-2 py-1 text-xs bg-gray-50 hover:bg-primary/10 text-gray-600 hover:text-primary rounded-lg border border-gray-200 transition-colors">' +
                            c.related + '</button>'
                        ).join('');
                    } else {
                        list.innerHTML = '<span class="text-gray-400 text-xs">暂无相关标签</span>';
                    }
                })
                .catch(function() {
                    if (seq !== _coocSeq) return;
                    list.innerHTML = '<span class="text-gray-400 text-xs">加载失败</span>';
                });
        }

        // ── 标签组弹窗 ────────────────────────────────────────────────────────
        function showGroupTags(groupId) {
            groupId = decodeURIComponent(groupId);
            const modal = document.getElementById('tag-group-modal');
            const title = document.getElementById('tgm-title');
            const count = document.getElementById('tgm-count');
            const list = document.getElementById('tgm-list');
            const container = list.querySelector('div');
            title.textContent = '加载中...';
            container.innerHTML = '<span class="text-gray-400 text-sm">正在加载...</span>';
            modal.classList.remove('hidden');
            fetch('/tag_group_tags/' + encodeURIComponent(groupId))
                .then(r => r.json())
                .then(data => {
                    title.textContent = data.display;
                    count.textContent = '共 ' + data.count + ' 个标签';
                    if (data.tags && data.tags.length) {
                        container.innerHTML = data.tags.map(t =>
                            '<button onclick="showTagDetail(\'' + encodeURIComponent(t) + '\'); closeGroupModal();" ' +
                            'class="px-2.5 py-1 text-xs bg-gray-50 hover:bg-primary/10 text-gray-600 hover:text-primary rounded-lg border border-gray-200 transition-colors">' +
                            t + '</button>'
                        ).join('');
                    } else {
                        container.innerHTML = '<span class="text-gray-400 text-sm">暂无标签</span>';
                    }
                })
                .catch(function() {
                    title.textContent = '加载失败';
                    container.innerHTML = '<span class="text-red-500 text-sm">请求失败</span>';
                });
        }

        function closeGroupModal() {
            document.getElementById('tag-group-modal').classList.add('hidden');
        }

        function enterWikiEditMode() {
            // 英文 wiki 只读，不允许编辑
            if (_detailState.tab === 'en') {
                showNotification('英文 Wiki 为只读，请在中文 Wiki tab 下编辑', 'warning');
                return;
            }
            if (_detailState.cnWikiLocked) {
                showNotification('中文 Wiki 已锁定，无法编辑', 'warning');
                return;
            }
            _wikiEditing = true;
            const view = document.getElementById('wiki-view');
            const editor = document.getElementById('wiki-editor');
            // 预填当前 tab 的实际内容（不预填占位提示文本）
            const cur = (_detailState.tab === 'en') ? _detailState.enWiki : _detailState.cnWiki;
            editor.value = cur;
            view.classList.add('hidden');
            editor.classList.remove('hidden');
            editor.focus();
            editor.setSelectionRange(editor.value.length, editor.value.length);
            refreshActionButtons();
        }

        function exitWikiEditMode(restoreView) {
            _wikiEditing = false;
            const view = document.getElementById('wiki-view');
            const editor = document.getElementById('wiki-editor');
            editor.classList.add('hidden');
            view.classList.remove('hidden');
            if (restoreView) {
                // 回到只读视图时用最新的 _detailState 重渲染（英文用 DText，中文纯文本）
                if (_detailState.tab === 'en') {
                    if (_detailState.enWiki) {
                        view.innerHTML = renderDText(_detailState.enWiki);
                        _dtextLoadThumbnails(view);
                    } else {
                        view.textContent = '(该标签暂无英文 wiki)';
                    }
                } else {
                    view.innerHTML = _detailState.cnWiki
                        ? _dtextInline(_detailState.cnWiki
                            .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'))
                        : (_detailState.enWiki
                            ? '(暂无中文 wiki，可点击"翻译并保存"生成，或点"编辑"手写)'
                            : '(该标签暂无 wiki)');
                }
            }
            refreshActionButtons();
        }

        function cancelWikiEdit() {
            exitWikiEditMode(true);
        }

        function saveWiki() {
            const editor = document.getElementById('wiki-editor');
            const content = editor.value;
            const lang = _detailState.tab;
            const saveBtn = document.getElementById('wiki-save-btn');
            saveBtn.disabled = true;
            saveBtn.innerHTML = '<i class="fa fa-spinner fa-spin mr-1"></i>保存中...';

            fetch('/update_tag_wiki', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({tag: _detailState.tag, lang: lang, content: content})
            })
            .then(r => r.json())
            .then(data => {
                saveBtn.disabled = false;
                saveBtn.innerHTML = '<i class="fa fa-check mr-1"></i>保存';
                if (data.error) { showNotification('保存失败：' + data.error, 'error'); return; }
                // 更新本地状态
                if (lang === 'en') _detailState.enWiki = data.content;
                else _detailState.cnWiki = data.content;
                exitWikiEditMode(true);
                showNotification((lang === 'en' ? '英文' : '中文') + ' wiki 已保存', 'success');
            })
            .catch(() => {
                saveBtn.disabled = false;
                saveBtn.innerHTML = '<i class="fa fa-check mr-1"></i>保存';
                showNotification('请求失败', 'error');
            });
        }

        function translateWiki() {
            if (!_detailState.enWiki) { showNotification('无英文 wiki 可翻译', 'warning'); return; }
            // 锁提醒
            if (_detailState.cnNameLocked || _detailState.cnWikiLocked) {
                var lockedFields = [];
                if (_detailState.cnNameLocked) lockedFields.push('中文名');
                if (_detailState.cnWikiLocked) lockedFields.push('中文 Wiki');
                showNotification('注意：' + lockedFields.join('、') + '已锁定，深度翻译不会覆盖该项', 'warning');
            }
            const btn = document.getElementById('wiki-translate-btn');
            const view = document.getElementById('wiki-view');
            btn.disabled = true;
            btn.innerHTML = '<i class="fa fa-spinner fa-spin mr-1"></i>翻译中...';

            fetch('/translate_single_tag', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({tag: _detailState.tag})
            })
            .then(r => r.json())
            .then(data => {
                btn.disabled = false;
                btn.innerHTML = '<i class="fa fa-language mr-1"></i>深度翻译';
                if (data.error) {
                    showNotification('翻译失败：' + data.error, 'error');
                    view.textContent = '翻译失败：' + data.error;
                    return;
                }
                // 更新 cn_name
                var updatedName = false;
                if (data.cn_name) {
                    const cnName = data.cn_name.split(',')[0].trim();
                    document.getElementById('d-cn-name').textContent = cnName;
                    document.getElementById('d-cn-edit-btn').classList.remove('hidden');
                    updatedName = true;
                }
                // 更新 cn_wiki
                var updatedWiki = false;
                if (data.cn_wiki) {
                    _detailState.cnWiki = data.cn_wiki;
                    view.innerHTML = _dtextInline(_detailState.cnWiki
                        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'));
                    updatedWiki = true;
                }
                refreshActionButtons();
                var parts = [];
                if (updatedName && !_detailState.cnNameLocked) parts.push('中文名');
                else if (_detailState.cnNameLocked) parts.push('中文名(已锁定跳过)');
                if (updatedWiki && !_detailState.cnWikiLocked) parts.push('Wiki');
                else if (_detailState.cnWikiLocked) parts.push('Wiki(已锁定跳过)');
                showNotification('深度翻译完成：' + (parts.length ? parts.join(' + ') : '无变更'), 'success');
            })
            .catch(() => {
                btn.disabled = false;
                btn.innerHTML = '<i class="fa fa-language mr-1"></i>深度翻译';
                showNotification('请求失败', 'error');
            });
        }

        // === 工具按钮操作（全部复用 executeWithProgress） ===
        function runFetchCooc() {
            executeWithProgress('/fetch_cooc', {}, '爬取共现数据', '正在从 Danbooru 拉取共现频率...',
                null,
                function(data) {
                    return '共现数据拉取完成，共处理 ' + (data.total || 0) + ' 条';
                }
            );
        }
        function runCrawlGroups() {
            executeWithProgress('/crawl_tag_groups', {}, '爬取标签分组', '正在爬取 Danbooru 标签组体系...',
                null,
                function(data) {
                    var c = data.groups || data.count || 0;
                    return '标签分组爬取完成：共 ' + c + ' 组';
                }
            );
        }
        function runLLMProcess() {
            executeWithProgress('/llm_process_db', {}, '批量深度翻译', '正在进行批量三层深度翻译（cn_name/cn_wiki/nsfw）...',
                null,
                function(data) {
                    return '深度翻译完成，共处理 ' + (data.processed || data.total || 0) + ' 条';
                }
            );
        }
        function runSyncTags() {
            executeWithProgress('/sync_tags_db', {}, '同步标签库', '正在从上游 GitHub SQLite 同步新标签...',
                null,
                function(data) {
                    return '同步完成，新增标签 ' + (data.new_count || 0) + ' 条';
                }
            );
        }

        // === 取消当前进度操作 ===
        var _progressController = null;
        var _progressSeq = 0;
        var _lastProgress = null;  // 最后一次 progress 事件数据，中断时显示实际保存进度

        function cancelProgress() {
            // 通知后端中断操作（设置 cancel event，让后端 generator 检查后主动退出）
            fetch('/danbooru_cancel', {method: 'POST'}).catch(function() {});
            if (_progressController) {
                _progressController.abort();
                _progressController = null;
            }
            var closeBtn = document.getElementById('progress-close-btn');
            closeBtn.classList.remove('hidden');
            document.getElementById('progress-cancel-btn').classList.add('hidden');
            var bar = document.getElementById('progress-bar');
            bar.classList.remove('bg-primary'); bar.classList.add('bg-red-500');
            // 显示实际已保存进度
            var count = document.getElementById('progress-count');
            if (_lastProgress && _lastProgress.current != null) {
                document.getElementById('progress-subtitle').textContent =
                    '已处理 ' + _lastProgress.current + (_lastProgress.total ? ' / ' + _lastProgress.total : '') + ' 条（已中断）';
                count.textContent = _lastProgress.current + (_lastProgress.total ? ' / ' + _lastProgress.total : '');
            } else {
                document.getElementById('progress-subtitle').textContent = '已中断';
            }
        }

        // === 增量更新 ===
        function runUpdate() {
            const btn = document.getElementById('btn-update');
            btn.disabled = true;
            btn.innerHTML = '<i class="fa fa-spinner fa-spin mr-1.5"></i> 更新中...';
            executeWithProgress('/danbooru_update', {}, '增量更新 Danbooru', '正在抓取最新 wiki...',
                function() {  // onComplete
                    btn.disabled = false;
                    btn.innerHTML = '<i class="fa fa-refresh mr-1.5"></i> 增量更新';
                },
                function(data) {  // summaryFn
                    return '增量更新完成：新增/更新 ' + (data.new_count || 0) + ' 条';
                }
            );
        }

        // === SSE 通用流式消费器（支持取消） ===
        function executeWithProgress(url, body, title, subtitle, onComplete, summaryFn) {
            const modal = document.getElementById('progress-modal');
            const bar = document.getElementById('progress-bar');
            const count = document.getElementById('progress-count');
            const pct = document.getElementById('progress-percent');
            const itemEl = document.getElementById('progress-item');
            const errBox = document.getElementById('progress-errors');
            const closeBtn = document.getElementById('progress-close-btn');
            const cancelBtn = document.getElementById('progress-cancel-btn');

            // 操作序列号，防止旧 finalize 干扰新弹窗
            var seq = ++_progressSeq;
            // 如果上一个操作还在进行，自动取消
            if (_progressController) {
                _progressController.abort();
                _progressController = null;
            }
            // 创建 AbortController 用于取消
            var controller = new AbortController();
            _progressController = controller;

            function openModal() {
                document.getElementById('progress-title').textContent = title;
                document.getElementById('progress-subtitle').textContent = subtitle;
                bar.style.width = '0%';
                bar.classList.remove('bg-red-500'); bar.classList.add('bg-primary');
                count.textContent = ''; pct.textContent = '';
                itemEl.textContent = '';
                errBox.innerHTML = ''; errBox.classList.add('hidden');
                closeBtn.classList.add('hidden');
                cancelBtn.classList.remove('hidden');
                modal.classList.remove('hidden');
            }

            function finalize(success, subtitleText) {
                if (seq !== _progressSeq) return;  // 旧操作的 finalize 不执行
                if (!success) {
                    bar.style.width = '100%';
                    bar.classList.remove('bg-primary'); bar.classList.add('bg-red-500');
                }
                document.getElementById('progress-subtitle').textContent = subtitleText;
                cancelBtn.classList.add('hidden');
                closeBtn.classList.remove('hidden');
                if (onComplete) onComplete({});
            }

            fetch(url, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(body),
                signal: controller.signal
            }).then(function(response) {
                var contentType = response.headers.get('Content-Type') || '';
                if (contentType.includes('application/json')) {
                    return response.json().then(function(data) {
                        if (data.error) showNotification(data.error, 'error');
                        else if (data.message) showNotification(data.message, 'info');
                        if (onComplete) onComplete(data);
                        return null;
                    });
                }
                if (!response.ok) {
                    return response.text().then(function(text) {
                        var msg = '请求失败';
                        try { msg = JSON.parse(text).error || msg; } catch(e) {}
                        throw new Error(msg);
                    });
                }
                // SSE 流模式 → 打开弹窗
                openModal();
                var reader = response.body.getReader();
                var decoder = new TextDecoder();
                var buffer = '';
                var currentEventType = '';
                var streamFinished = false;  // 是否收到 complete/fatal 正常收尾事件

                function processLines() {
                    if (seq !== _progressSeq) return;  // 旧操作的 SSE 数据不处理
                    var lines = buffer.split('\n');
                    buffer = lines.pop() || '';
                    for (var i = 0; i < lines.length; i++) {
                        var line = lines[i];
                        if (line.startsWith('event: ')) {
                            currentEventType = line.slice(7).trim();
                        } else if (line.startsWith('data: ')) {
                            try {
                                var data = JSON.parse(line.slice(6));
                            } catch(e) { currentEventType = ''; continue; }
                            if (currentEventType === 'progress') {
                                _lastProgress = data;
                                itemEl.textContent = data.item || '';
                                if (data.total && data.total !== '?') {
                                    var percent = Math.round((data.current / data.total) * 100);
                                    bar.style.width = percent + '%';
                                    count.textContent = data.current + ' / ' + data.total;
                                    pct.textContent = percent + '%';
                                } else {
                                    count.textContent = data.current || '';
                                    pct.textContent = '';
                                }
                            } else if (currentEventType === 'error') {
                                errBox.classList.remove('hidden');
                                var div = document.createElement('div');
                                div.textContent = (data.item ? data.item + ': ' : '') + data.error;
                                errBox.appendChild(div);
                            } else if (currentEventType === 'complete') {
                                streamFinished = true;
                                bar.style.width = '100%';
                                pct.textContent = '100%';
                                itemEl.textContent = '';
                                if (summaryFn) {
                                    document.getElementById('progress-subtitle').textContent = summaryFn(data);
                                }
                                cancelBtn.classList.add('hidden');
                                closeBtn.classList.remove('hidden');
                                if (onComplete) onComplete(data);
                            } else if (currentEventType === 'fatal') {
                                streamFinished = true;
                                bar.style.width = '100%';
                                bar.classList.remove('bg-primary'); bar.classList.add('bg-red-500');
                                itemEl.textContent = data.error;
                                cancelBtn.classList.add('hidden');
                                closeBtn.classList.remove('hidden');
                                if (onComplete) onComplete(data);
                            }
                            currentEventType = '';
                        }
                    }
                }

                // 检查是否已被取消
                function isAborted() {
                    return controller && controller.signal.aborted;
                }

                // 流提前结束兜底：done 但未收到 complete/fatal（后端崩溃/代理超时/取消）
                function finishStream(aborted) {
                    if (streamFinished) return;  // 已正常收尾
                    if (aborted || isAborted()) {
                        var msg = '操作已中断';
                        if (_lastProgress && _lastProgress.current != null) {
                            msg = '已处理 ' + _lastProgress.current + (_lastProgress.total ? ' / ' + _lastProgress.total : '') + ' 条（已中断）';
                            count.textContent = _lastProgress.current + (_lastProgress.total ? ' / ' + _lastProgress.total : '');
                        }
                        finalize(false, msg);
                        return;
                    }
                    bar.style.width = '100%';
                    bar.classList.remove('bg-primary'); bar.classList.add('bg-red-500');
                    errBox.classList.remove('hidden');
                    var div = document.createElement('div');
                    div.textContent = '连接异常中断：未收到完成信号';
                    errBox.appendChild(div);
                    finalize(false, '抓取中断，请重试');
                }

                function read() {
                    reader.read().then(function(result) {
                        if (isAborted()) { finishStream(true); return; }
                        if (result.done) {
                            if (buffer.trim()) { buffer += '\n'; processLines(); }
                            finishStream();  // 兜底：未收到 complete/fatal 时提示中断
                            return;
                        }
                        buffer += decoder.decode(result.value, {stream: true});
                        processLines();
                        read();
                    }).catch(function(err) {
                        if (isAborted()) { finishStream(true); return; }
                        // 读取异常（网络中断/代理断开）：提示错误，恢复可关闭
                        bar.style.width = '100%';
                        bar.classList.remove('bg-primary'); bar.classList.add('bg-red-500');
                        errBox.classList.remove('hidden');
                        var div = document.createElement('div');
                        div.textContent = '读取流失败：' + (err && err.message ? err.message : '网络中断');
                        errBox.appendChild(div);
                        finalize(false, '连接异常，已停止');
                    });
                }
                read();
                return null;
            }).catch(function(err) {
                // 取消操作的 AbortError 不弹通知
                if (err.name === 'AbortError') {
                    finalize(false, '操作已取消');
                    return;
                }
                showNotification(err.message || '请求失败', 'error');
                if (onComplete) onComplete({});
            });
        }

        function closeProgressModal() {
            document.getElementById('progress-modal').classList.add('hidden');
        }

        // === 工具 ===
        let _notifyTimer = null;
        function showNotification(message, type) {
            const n = document.getElementById('notification');
            const colors = {success:'bg-green-500 text-white',error:'bg-red-500 text-white',warning:'bg-amber-500 text-white',info:'bg-blue-500 text-white'};
            n.className = 'fixed bottom-5 right-5 px-5 py-3 rounded-lg shadow-lg flex items-center z-50 transition-all duration-300 text-sm ' + (colors[type]||colors.info);
            n.textContent = message;
            n.style.transform = 'translateY(0)'; n.style.opacity = '1';
            if (_notifyTimer) clearTimeout(_notifyTimer);
            _notifyTimer = setTimeout(() => { n.style.transform = 'translateY(20px)'; n.style.opacity = '0'; _notifyTimer = null; }, 3000);
        }

        function escapeHtml(str) {
            return String(str).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/'/g,'&#39;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
        }

        // 页面加载后聚焦搜索框
        document.getElementById('search-input').focus();
        // 加载随机推荐标签
        loadRandomTags();
    </script>
